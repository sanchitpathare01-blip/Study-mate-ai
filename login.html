<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your StudyMate AI dashboard.">
  <title>Login — StudyMate AI</title>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body class="auth-page">

  <!-- Fullscreen Loading Overlay for Auth State Verification -->
  <div id="auth-loading-overlay" class="loading-overlay">
    <div class="spinner spinner-lg"></div>
    <p>Verifying session...</p>
  </div>

  <!-- Header with Brand & Theme Toggle -->
  <header class="auth-header">
    <a href="index.html" class="brand-logo" aria-label="StudyMate AI Home">
      <span class="brand-icon" aria-hidden="true">✦</span>
      <span>StudyMate<span class="gradient-text">.ai</span></span>
    </a>

    <div class="nav-actions">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle dark and light theme" title="Toggle Theme">
        <!-- Icon injected by theme.js -->
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="auth-main">
    <div class="auth-glow-top"></div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h1>Welcome Back</h1>
        <p>Log in to access your study materials and dashboard</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="login-email-input" class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <input 
              type="email" 
              id="login-email-input" 
              name="email" 
              class="form-input" 
              placeholder="you@example.com" 
              autocomplete="email" 
              required
            >
          </div>
          <span id="login-email-error" class="form-error">Please enter a valid email address.</span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="login-password-input" class="form-label">Password</label>
          <div class="form-input-wrapper">
            <input 
              type="password" 
              id="login-password-input" 
              name="password" 
              class="form-input" 
              placeholder="Your password" 
              autocomplete="current-password" 
              required
            >
            <button type="button" class="password-toggle-btn" data-target="login-password-input" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
          <span id="login-password-error" class="form-error">Please enter your password.</span>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="auth-options">
          <label class="form-checkbox">
            <input type="checkbox" id="remember-me-checkbox" checked>
            <span>Remember me</span>
          </label>

          <button type="button" id="forgot-password-link" class="auth-forgot-link">
            Forgot password?
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
          Log In
        </button>

        <button type="button" id="demo-mode-btn" class="btn btn-secondary btn-block" style="margin-top: var(--space-3);">
          ⚡ Instant Demo Access (1-Click)
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="reset-modal-title" class="modal-title">Reset Your Password</h3>
        <button type="button" class="modal-close-btn" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: var(--space-4);">Enter your email address and we'll send you a password reset link.</p>
        <form id="reset-password-form">
          <div class="form-group">
            <label for="reset-email-input" class="form-label">Email Address</label>
            <input type="email" id="reset-email-input" class="form-input" placeholder="you@example.com" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
        <button type="button" id="send-reset-btn" class="btn btn-primary">Send Reset Link</button>
      </div>
    </div>
  </div>

  <!-- Module Script -->
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
